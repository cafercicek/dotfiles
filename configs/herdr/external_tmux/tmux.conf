# herdr-style tmux bindings (standalone — no herdr binary)
# Installed via: ~/.config/herdr/external_tmux/apply.sh

# --- General ---
set -g default-terminal "screen-256color"
set -g escape-time 0
set -g focus-events on
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prefix: Ctrl+Space (herdr default)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- UI ---
set -g status-position top
set -g status-style "fg=colour245,bg=colour235"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=colour39,bold] #S "
set -g status-right "#[fg=colour245]#{pane_current_path} "
setw -g window-status-current-style "fg=colour39,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W* "

set -g pane-border-status top
set -g pane-border-format " #{pane_index} │ #{pane_title} "
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"

# --- Pane focus: prefix+hjkl and alt+hjkl ---
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# alt+1..9 → focus pane by number (herdr focus_agent slot)
bind -n M-1 select-pane -t 1
bind -n M-2 select-pane -t 2
bind -n M-3 select-pane -t 3
bind -n M-4 select-pane -t 4
bind -n M-5 select-pane -t 5
bind -n M-6 select-pane -t 6
bind -n M-7 select-pane -t 7
bind -n M-8 select-pane -t 8
bind -n M-9 select-pane -t 9

# --- Splits ---
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -n M-L split-window -h -c "#{pane_current_path}"
bind -n M-J split-window -v -c "#{pane_current_path}"
bind -n M-H run-shell "$HOME/.config/herdr/external_tmux/scripts/split-left.sh"
bind -n M-K run-shell "$HOME/.config/herdr/external_tmux/scripts/split-up.sh"

# --- Tabs (windows) ---
bind t new-window -c "#{pane_current_path}"
bind -n M-t new-window -c "#{pane_current_path}"
bind p previous-window
bind -n M-p previous-window

# --- Copy mode ---
# Alt+C → toggle copy mode (herdr gibi)
# Copy mode içinde: Ctrl+Space veya q/Esc → çık, v → seç, y → panoya kopyala
setw -g mode-keys vi
set -g set-clipboard on

bind [ copy-mode
bind -n M-c if -F '#{pane_in_mode}' 'send-keys -X cancel' 'copy-mode'

bind -T copy-mode-vi C-Space send-keys -X cancel
bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "$HOME/.config/herdr/external_tmux/scripts/copy-yank.sh"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "$HOME/.config/herdr/external_tmux/scripts/copy-yank.sh"

bind -T copy-mode-emacs C-Space send-keys -X cancel
bind -T copy-mode-emacs Escape send-keys -X cancel
bind -T copy-mode-emacs Enter send-keys -X copy-pipe-and-cancel "$HOME/.config/herdr/external_tmux/scripts/copy-yank.sh"

# --- Goto ---
bind g display-popup -E "tmux choose-tree -s -w"
bind -n M-g display-popup -E "tmux choose-tree -s -w"

# --- Close ---
bind x confirm-before -p "kill pane #{pane_index}? (y/n)" kill-pane
bind -n M-x confirm-before -p "kill pane #{pane_index}? (y/n)" kill-pane
bind D confirm-before -p "kill session #{session_name}? (y/n)" kill-session
bind -n M-N run-shell "$HOME/.config/herdr/external_tmux/scripts/close-workspace.sh"

# --- Resize mode ---
bind r switch-client -T resize
bind -n M-r switch-client -T resize
bind -T resize H resize-pane -L 3
bind -T resize J resize-pane -D 3
bind -T resize K resize-pane -U 3
bind -T resize L resize-pane -R 3
bind -T resize h resize-pane -L 3
bind -T resize j resize-pane -D 3
bind -T resize k resize-pane -U 3
bind -T resize l resize-pane -R 3
bind -T resize r switch-client -T root
bind -T resize C-Space switch-client -T root
bind -T resize Escape switch-client -T root

# --- Workspaces (tmux sessions) ---
bind -n M-q run-shell "$HOME/.config/herdr/external_tmux/scripts/workspace-switch.sh prev"
bind -n M-a run-shell "$HOME/.config/herdr/external_tmux/scripts/workspace-switch.sh next"
bind N run-shell "$HOME/.config/herdr/external_tmux/scripts/workspace-switch.sh new"
bind -n M-n run-shell "$HOME/.config/herdr/external_tmux/scripts/workspace-switch.sh new"

# --- Custom (voice + scrollback) ---
bind -n M-e run-shell "$HOME/.config/herdr/external_tmux/scripts/alt-e-scrollback.sh"
bind -n M-v run-shell "$HOME/.config/herdr/voice-toggle.sh en"
bind -n M-f run-shell "$HOME/.config/herdr/voice-toggle.sh tr"

# --- Extras ---
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -v -c "#{pane_current_path}"
bind z resize-pane -Z
bind Tab last-pane
bind S-Tab last-window
